name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ROSTOK_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rostok.jks"
          echo "ROSTOK_KEYSTORE_PATH=$RUNNER_TEMP/rostok.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          ROSTOK_KEYSTORE_PASSWORD: ${{ secrets.ROSTOK_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: rostok-apk
          path: app/build/outputs/apk/release/*.apk
